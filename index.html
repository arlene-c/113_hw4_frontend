<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Outfit Advisor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .input-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            display: none;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .weather-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .weather-temp {
            font-size: 3rem;
            font-weight: bold;
            color: #667eea;
        }

        .weather-condition {
            font-size: 1.3rem;
            color: #666;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .weather-detail {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .weather-detail-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
        }

        .weather-detail-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }

        .outfit-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
        }

        .outfit-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .outfit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .outfit-item {
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .outfit-item-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .outfit-item-content {
            color: #333;
            font-size: 1.1rem;
        }

        .accessories-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .accessory-tag {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .color-palette {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .color-swatch {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 8px;
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .style-tips {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #f39c12;
        }

        .style-tips-title {
            font-weight: 600;
            color: #d35400;
            margin-bottom: 10px;
        }

        .style-tips-content {
            color: #7f5a34;
            line-height: 1.6;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #c33;
            display: none;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .weather-temp {
                font-size: 2.5rem;
            }

            .outfit-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>☀️ Weather Outfit Advisor</h1>
            <p>Get personalized outfit recommendations based on weather and your mood</p>
        </header>

        <!-- Input Form -->
        <div class="input-section">
            <form id="outfitForm">
                <div class="form-group">
                    <label for="location">📍 Location</label>
                    <input type="text" id="location" placeholder="e.g., San Francisco, CA" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="mood">🎭 Mood</label>
                        <select id="mood" required>
                            <option value="casual">Casual</option>
                            <option value="professional">Professional</option>
                            <option value="adventurous">Adventurous</option>
                            <option value="cozy">Cozy</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="style">👔 Style Preference</label>
                        <select id="style" required>
                            <option value="casual">Casual</option>
                            <option value="minimalist">Minimalist</option>
                            <option value="bold">Bold</option>
                            <option value="classic">Classic</option>
                            <option value="trendy">Trendy</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="color">🎨 Color Preference</label>
                        <select id="color" required>
                            <option value="neutral">Neutral</option>
                            <option value="warm">Warm</option>
                            <option value="cool">Cool</option>
                            <option value="vibrant">Vibrant</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="submitBtn">Get Outfit Recommendation</button>
                <div class="error-message" id="errorMessage"></div>
            </form>
        </div>

        <!-- Loading Indicator -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Finding the perfect outfit for you...</p>
        </div>

        <!-- Results Section -->
        <div class="results" id="results">
            <!-- Weather Card -->
            <div class="weather-card">
                <div class="weather-header">
                    <div>
                        <div class="weather-temp" id="temperature"></div>
                        <div class="weather-condition" id="condition"></div>
                    </div>
                    <div style="font-size: 4rem;">🌤️</div>
                </div>
                <div class="weather-details">
                    <div class="weather-detail">
                        <div class="weather-detail-label">Humidity</div>
                        <div class="weather-detail-value" id="humidity"></div>
                    </div>
                    <div class="weather-detail">
                        <div class="weather-detail-label">Wind Speed</div>
                        <div class="weather-detail-value" id="windSpeed"></div>
                    </div>
                </div>
            </div>

            <!-- Outfit Recommendations -->
            <div class="outfit-section">
                <h2>Your Perfect Outfit</h2>
                <div class="outfit-grid">
                    <div class="outfit-item">
                        <div class="outfit-item-title">👕 Top</div>
                        <div class="outfit-item-content" id="top"></div>
                    </div>
                    <div class="outfit-item">
                        <div class="outfit-item-title">👖 Bottom</div>
                        <div class="outfit-item-content" id="bottom"></div>
                    </div>
                    <div class="outfit-item">
                        <div class="outfit-item-title">🧥 Outerwear</div>
                        <div class="outfit-item-content" id="outerwear"></div>
                    </div>
                    <div class="outfit-item">
                        <div class="outfit-item-title">👟 Footwear</div>
                        <div class="outfit-item-content" id="footwear"></div>
                    </div>
                </div>

                <div class="outfit-item">
                    <div class="outfit-item-title">✨ Accessories</div>
                    <div class="accessories-list" id="accessories"></div>
                </div>

                <h2 style="margin-top: 30px;">Recommended Color Palette</h2>
                <div class="color-palette" id="colorPalette"></div>

                <div class="style-tips">
                    <div class="style-tips-title">💡 Style Tips</div>
                    <div class="style-tips-content" id="styleTips"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION - Update this with your Render.com backend URL
        const API_BASE_URL = 'https://your-app-name.onrender.com';  // Replace with your actual Render URL
        
        // Color mapping for color swatches
        const colorMap = {
            'Navy': '#001f3f',
            'Beige': '#d2b48c',
            'White': '#ffffff',
            'Gray': '#808080',
            'Burgundy': '#800020',
            'Mustard': '#ffdb58',
            'Rust': '#b7410e',
            'Cream': '#fffdd0',
            'Teal': '#008080',
            'Silver': '#c0c0c0',
            'Ice Blue': '#99ccff',
            'Red': '#ff0000',
            'Emerald': '#50c878',
            'Royal Blue': '#4169e1',
            'Yellow': '#ffff00'
        };

        // Form submission handler
        document.getElementById('outfitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Get form values
            const location = document.getElementById('location').value;
            const mood = document.getElementById('mood').value;
            const style = document.getElementById('style').value;
            const color = document.getElementById('color').value;
            
            // Show loading, hide results and errors
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('submitBtn').disabled = true;
            
            try {
                // Make API request to backend
                const response = await fetch(`${API_BASE_URL}/api/outfit-recommendation`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        location: location,
                        mood: mood,
                        style_preference: style,
                        color_preference: color
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to get recommendation');
                }
                
                // Display results
                displayResults(data);
                
            } catch (error) {
                // Show error message
                const errorMsg = document.getElementById('errorMessage');
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
            } finally {
                // Hide loading
                document.getElementById('loading').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
            }
        });
        
        function displayResults(data) {
            // Display weather information
            document.getElementById('temperature').textContent = `${data.weather.temperature}°F`;
            document.getElementById('condition').textContent = data.weather.description;
            document.getElementById('humidity').textContent = `${data.weather.humidity}%`;
            document.getElementById('windSpeed').textContent = `${data.weather.wind_speed} mph`;
            
            // Display outfit recommendations
            document.getElementById('top').textContent = data.outfit.top;
            document.getElementById('bottom').textContent = data.outfit.bottom;
            document.getElementById('outerwear').textContent = data.outfit.outerwear || 'Not needed';
            document.getElementById('footwear').textContent = data.outfit.footwear;
            
            // Display accessories
            const accessoriesContainer = document.getElementById('accessories');
            accessoriesContainer.innerHTML = '';
            data.outfit.accessories.forEach(accessory => {
                const tag = document.createElement('div');
                tag.className = 'accessory-tag';
                tag.textContent = accessory;
                accessoriesContainer.appendChild(tag);
            });
            
            // Display color palette
            const paletteContainer = document.getElementById('colorPalette');
            paletteContainer.innerHTML = '';
            data.color_palette.forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = colorMap[color] || '#999';
                swatch.textContent = color;
                paletteContainer.appendChild(swatch);
            });
            
            // Display style tips
            document.getElementById('styleTips').textContent = data.style_tips;
            
            // Show results
            document.getElementById('results').style.display = 'block';
            
            // Smooth scroll to results
            document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
</body>
</html>
